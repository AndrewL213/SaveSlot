<!doctype html>

<head>

<body data-page="inicio" data-section="inicio">

<main class="container page">
  <section class="stack" style="gap:18px;align-items:flex-start">
    <span class="eyebrow">Tu solución gamer</span>
    <h1 style="font-size:clamp(34px,5vw,52px);letter-spacing:-.02em;max-width:820px">Todo sobre tus juegos y sus comunidades, en un solo lugar.</h1>
    <form class="search-big" action="buscar.html" role="search">
      <span class="tag-ai">IA</span>
      <label class="sr-only" for="mq">Busca un juego o haz una pregunta</label>
      <input id="mq" name="q" type="search" placeholder="Busca un juego, por ejemplo Hollow Knight">
      <button class="btn btn-primary" type="submit">Buscar</button>
    </form>
    <div class="row" style="gap:8px">
      <a class="chip" href="random.html">Juego random por género</a>
      <a class="chip" href="matchplay.html?q=Recomi%C3%A9ndame%20algo%20corto%20para%20el%20finde">Recomiéndame algo corto</a>

    </div>
  </section>

  <section class="section">
    <div class="section-head"><h2>Mejores juegos de la semana</h2><a class="link-strong" href="buscar.html">Ver ranking completo</a></div>
    <div class="grid g-auto-170" id="top-games"></div>
  </section>

  <section class="section">
    <div class="section-head"><h2>Reseñas destacadas</h2><a class="link-strong" href="juego.html?id=zelda-totk">Ver más reseñas</a></div>

  </section>

  <section class="section">
    <div class="section-head"><h2>Eventos</h2><a class="link-strong" href="eventos.html">Ver todos los eventos</a></div>
    <div class="row" style="gap:16px;align-items:stretch" id="events-home"></div>
  </section>
</main>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/api.js"></script>

<script src="js/pages-cuenta.js"></script>

</html>
