<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi perfil · SaveSlot</title>
<meta name="description" content="Tu perfil gamer: actividad, favoritos, diario, géneros y lista de deseos.">
<meta name="theme-color" content="#12161D">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="perfil" data-section="perfil">

<main>
  <div class="container" style="padding-top:24px">
    <div style="height:180px;border-radius:16px 16px 0 0;background:#1F4A8A"></div>
    <div class="panel" style="border-top:0;border-radius:0 0 16px 16px;flex-direction:row;flex-wrap:wrap;align-items:flex-end;gap:20px;padding:0 28px 24px">
      <div style="position:relative;margin-top:-64px;flex:none">
        <span class="avatar" id="avatar" style="width:132px;height:132px;font-size:48px;border:6px solid var(--surface)">S</span>
        <span id="status-dot" title="Jugando ahora" style="position:absolute;right:8px;bottom:8px;width:28px;height:28px;border-radius:50%;background:var(--good);border:5px solid var(--surface)"></span>
      </div>
      <div class="stack grow" style="flex:999 1 320px;gap:6px;padding-top:14px">
        <div class="row" style="align-items:baseline"><h1 style="font-size:32px" id="name">…</h1><span class="muted" id="handle"></span></div>
        <div class="row" style="gap:6px"><span class="badge badge-accent" id="level">NIVEL</span><span class="badge badge-outline">FUNDADOR BETA</span></div>
      </div>
      <div class="row"><a class="btn btn-secondary" href="editar-perfil.html">Editar perfil</a><button class="btn btn-secondary" id="share" aria-label="Copiar enlace del perfil">Compartir</button></div>
    </div>
  </div>
  <div class="container page" style="padding-top:24px">
    <div class="split">
      <aside class="side" style="flex:1 1 320px">
        <section class="panel"><h2 class="panel-title">Actividad</h2><div id="activity"></div></section>
        <section class="panel">
          <div class="stack" style="gap:4px"><h2 class="panel-title">Sobre mí</h2><p id="bio" style="font-size:15px"></p></div>
          <div class="stack" style="gap:4px"><h2 class="panel-title">Miembro desde</h2><span id="since"></span></div>
          <div class="stack" style="gap:8px"><h2 class="panel-title">Progreso</h2><div class="meter"><i id="xp-bar"></i></div><span class="xs muted" id="xp-text"></span></div>
        </section>
        <section class="panel"><h2 class="panel-title">Conexiones</h2><div class="stack" style="gap:8px" id="connections"></div></section>
        <section class="panel"><h2 class="panel-title">Mis eventos</h2><div class="stack" style="gap:8px" id="my-events"></div></section>
      </aside>
      <div class="main" style="gap:28px">
        <section class="grid" id="stats" style="grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden" aria-label="Estadísticas"></section>
        <section class="section"><div class="section-head"><h2 style="font-size:22px">Juegos favoritos</h2><span class="small muted" id="fav-count"></span></div><div class="grid g-4" id="favorites"></div></section>
        <section class="section"><div class="section-head"><h2 style="font-size:22px">Actividad reciente</h2><a class="link-strong small" href="diario.html">Ver diario</a></div><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px" id="recent"></div></section>
        <div class="row" style="gap:20px;align-items:stretch">
          <section class="panel" style="flex:1 1 300px"><div class="row between"><h2 style="font-size:18px">Géneros más jugados</h2><span class="xs muted">% de horas</span></div>
            <div id="genres" style="display:grid;grid-template-columns:90px 1fr 40px;gap:8px 10px;align-items:center;font-size:14px"></div><span class="xs muted" id="fav-genres"></span></section>
          <section class="panel" style="flex:1 1 300px"><div class="row between"><h2 style="font-size:18px">Calificaciones</h2><span class="xs muted">Promedio <b class="score" id="avg"></b></span></div>
            <div id="hist" role="img" style="display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;align-items:end;height:84px;border-bottom:1px solid var(--line)"></div>
            <div style="display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;font-size:12px;color:var(--muted);text-align:center"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span></div></section>
        </div>
        <section class="section" id="deseos"><div class="section-head"><h2 style="font-size:22px">Lista de deseos</h2><span class="xs muted">Te avisaremos si bajan de precio</span></div><div class="grid g-auto-260" id="wishlist"></div></section>
      </div>
    </div>
  </div>
</main>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/pages-juegos.js"></script>
<script src="js/pages-cuenta.js"></script>
</body>
</html>
