<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MatchPlay · SaveSlot</title>
<meta name="description" content="MatchPlay, el asistente con IA de SaveSlot: recomendaciones y respuestas sobre tus juegos.">
<meta name="theme-color" content="#12161D">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="matchplay" data-section="matchplay">

<main class="chat-layout">
  <aside class="chat-side" aria-label="Biblioteca de chats">
    <button class="btn btn-primary" id="new-chat"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#08131C" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Nuevo chat</button>
    <div class="header-search" style="flex:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9AA8B8" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><label class="sr-only" for="chat-search">Buscar en tus chats</label><input id="chat-search" placeholder="Buscar en tus chats"></div>
    <nav id="chat-list" class="stack" style="gap:2px" aria-label="Chats anteriores"></nav>
  </aside>
  <section class="chat-main" aria-label="Conversación">
    <div id="empty-state" style="flex:1;padding:56px 32px 24px;display:flex;flex-direction:column;align-items:center;gap:28px">
      <div class="stack" style="align-items:center;text-align:center;gap:12px">
        <span class="ai-badge" style="width:56px;height:56px;border-radius:14px;font-size:16px">IA</span>
        <h1 style="font-size:clamp(26px,3.5vw,36px)" id="greet">Hola. ¿En qué te ayudo hoy?</h1>
        <p class="muted">Pregúntame por cualquier juego, pídeme recomendaciones o ayuda con un logro.</p>
      </div>
      <div class="stack" style="width:100%;max-width:820px;gap:14px">
        <div class="section-head"><h2 style="font-size:20px">Tendencias</h2><span class="xs muted">Lo que más pregunta la comunidad hoy</span></div>
        <div class="grid g-auto-260" id="trending"></div>
      </div>
    </div>
    <div class="thread" id="thread" hidden aria-live="polite"></div>
    <form class="composer" id="composer">
      <div class="box"><label class="sr-only" for="msg">Escribe tu mensaje</label><input id="msg" autocomplete="off" placeholder="Pregunta lo que quieras sobre tus juegos" maxlength="600">
        <button class="btn btn-primary" type="submit" aria-label="Enviar" style="width:48px;padding:0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#08131C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
      <span class="xs muted" style="text-align:center"><span id="mode"></span> MatchPlay puede equivocarse: revisa los datos importantes.</span>
    </form>
  </section>
</main>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/pages-juegos.js"></script>
<script src="js/pages-cuenta.js"></script>
</body>
</html>
