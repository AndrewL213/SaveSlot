<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juego · SaveSlot</title>
<meta name="description" content="Dificultad, tiempo para completar, reseñas, guías y logros del juego.">
<meta name="theme-color" content="#12161D">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="juego" data-section="comunidad">

<main>
  <div class="hero-band" id="band">
    <div class="container">
      <nav class="crumbs" aria-label="Ruta"><a href="index.html">Inicio</a><span aria-hidden="true">/</span><a id="crumb-genre" href="buscar.html">Juegos</a><span aria-hidden="true">/</span><span id="crumb-title" style="color:var(--fg)">…</span></nav>
      <div class="row" style="gap:32px;align-items:flex-end">
        <div id="g-cover" class="skeleton" style="width:220px;aspect-ratio:3/4"></div>
        <div class="stack grow" style="flex:999 1 480px;gap:14px">
          <span class="eyebrow" id="g-eyebrow"></span>
          <h1 style="font-size:clamp(30px,4vw,48px);letter-spacing:-.02em" id="g-title">Cargando…</h1>
          <div class="row" style="gap:8px" id="g-plats"></div>
          <div class="row" style="margin-top:6px">
            <a class="btn btn-primary" id="write" href="resena.html">Escribir reseña</a>
            <button class="btn btn-secondary" id="wish" type="button">+ Lista de deseos</button>
            <a class="btn btn-secondary" id="ask" href="matchplay.html"><span class="tag-ai">IA</span>Preguntar a MatchPlay</a>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="container page" style="gap:32px">
    <section class="facts" id="facts" aria-label="Datos clave"></section>
    <div class="split">
      <div class="main" style="gap:18px">
        <div class="tabs" role="tablist" aria-label="Contenido del juego" id="tabs"></div>
        <div class="stack" id="panel" role="tabpanel"></div>
      </div>
      <aside class="side">
        <div class="panel"><h2 style="font-size:20px">Ficha del juego</h2><dl id="ficha" style="margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px"></dl></div>
        <div class="panel"><h2 style="font-size:20px">Si te gusta, prueba</h2><div class="stack" style="gap:12px" id="similar"></div></div>
      </aside>
    </div>
  </div>
</main>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/pages-juegos.js"></script>
<script src="js/pages-cuenta.js"></script>
</body>
</html>
